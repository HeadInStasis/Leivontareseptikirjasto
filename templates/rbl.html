<!DOCTYPE html>
<html>

<head>
    <title>Recipes {{ letter }}</title>
</head>
<body>
	<h1>Recipes {{ letter }}</h1>

    {% for recipe in recipes %}
        <p>
            <a href="/recipe/{{ recipe.id }}">{{ recipe.name }}</a><br>
            By {{ recipe.username }}
        </p>
        <hr>
    {% endfor %}
   
    <p>
        <a href="/">Back to Bakelist</a>
    </p>

</body>

</html>
