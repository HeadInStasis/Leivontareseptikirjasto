<!DOCTYPE html>
<html>

<head>
    <title>{{ recipe.name }}</title>
</head>

<body>

    <h1>{{ recipe.name }}</h1>
    <p>By {{ recipe.username }}</p>

    <h2>Ingredients</h2>
    <p>{{ recipe.ingredients }}</p>

    <h2>Instructions</h2>
    <p>{{ recipe.instructions }}</p>
    <p>
        <a href="/">Back to Bakelist</a>
    </p>

    <h2>Categories</h2>

    {% if categories %}
        <ul>
            {% for category in categories %}
                <li>{{ category.name }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No categories.</p>
    {% endif %}

</body>

</html>
