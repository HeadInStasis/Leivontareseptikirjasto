{% extends "layout.html" %}

{% block title %}Edit Recipe{% endblock %}

{% block content %}

<h1>Edit Recipe</h1>

<form method="post" action="/edit-recipe/{{ recipe.id }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

```
<p>
    Recipe name:<br>
    <input type="text" name="name" value="{{ recipe.name }}" required>
</p>

<p>
    Ingredients:<br>
    <textarea name="ingredients" rows="20" required>{{ recipe.ingredients }}</textarea>
</p>

<p>
    Instructions:<br>
    <textarea name="instructions" rows="20" required>{{ recipe.instructions }}</textarea>
</p>

<p>
    Categories:<br>

    {% for category in categories %}
        <label>
            <input
                type="checkbox"
                name="categories"
                value="{{ category.id }}"
                {% if category.id in selected_category_ids %}
                    checked
                {% endif %}
            >
            {{ category.name }}
        </label>
        <br>
    {% endfor %}
</p>

<button type="submit">Save changes</button>
```

</form>

<p>
    <a href="/recipe/{{ recipe.id }}">Cancel</a>
</p>

{% endblock %}
